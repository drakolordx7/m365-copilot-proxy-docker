# CasaOS custom-app compose for M365 Copilot Proxy.
# Import this file in CasaOS → App Store → Custom Install / Import.
#
# Image (linux/amd64 + linux/arm64):
#   ghcr.io/drakolordx7/m365-copilot-proxy-docker:latest
#
# Default auth is interactive OAuth (passkeys OK). Open /auth after install.

name: m365-copilot-proxy
services:
  m365-copilot-proxy:
    cpu_shares: 90
    command: []
    container_name: m365-copilot-proxy
    deploy:
      resources:
        limits:
          memory: 2147483648
        reservations:
          memory: "536870912"
          devices: []
    environment:
      - HOME=/root
      - HOST=0.0.0.0
      - NITRO_HOST=0.0.0.0
      - PORT=4141
      - NITRO_PORT=4141
      - CHROMIUM_PATH=/usr/bin/chromium
      - PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
      - M365_AUTH_MODE=oauth
      - M365_SECRETS_FILE=/root/.config/opencode-m365/secrets.json
      - M365_CACHE_FILE=/root/.config/opencode-m365/msal-cache.json
      - M365_BROWSER_PROFILE=/root/.config/opencode-m365/browser-profile
      - M365_DEBUG=0
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4141/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    image: ghcr.io/drakolordx7/m365-copilot-proxy-docker:latest
    labels:
      icon: https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/microsoftcopilot.svg
    ports:
      - mode: ingress
        target: 4141
        published: "4141"
        protocol: tcp
    privileged: false
    restart: unless-stopped
    shm_size: "268435456"
    volumes:
      - type: bind
        source: /DATA/AppData/m365-copilot-proxy/config
        target: /root/.config/opencode-m365
        bind:
          create_host_path: true
    devices: []
    cap_add: []
    x-casaos:
      envs:
        - container: M365_AUTH_MODE
          description:
            en_US: >
              oauth (default) = browser/passkey sign-in at /auth.
              secrets = email/password/TOTP via secrets.json.
              auto = secrets.json if present, else oauth.
        - container: M365_DEBUG
          description:
            en_US: Set to 1 to write truncated debug logs under the config volume.
        - container: M365_TRACE
          description:
            en_US: Set to 1 for full untruncated protocol tracing (implies M365_DEBUG).
        - container: PORT
          description:
            en_US: Internal listen port (keep 4141 unless you also change port mapping).
      volumes:
        - container: /root/.config/opencode-m365
          description:
            en_US: >
              Auth state — msal-cache.json after OAuth, optional secrets.json,
              browser-profile/, and agent-id.json.
      ports:
        - container: "4141"
          description:
            en_US: OpenAI-compatible API (/v1) and OAuth UI (/auth).
    networks:
      - m365-copilot-proxy-network
networks:
  m365-copilot-proxy-network:
    name: m365-copilot-proxy_m365-copilot-proxy-network
    driver: bridge
x-casaos:
  architectures:
    - amd64
    - arm64
  author: drakolordx7
  category: AI
  description:
    en_US: >
      OpenAI-compatible HTTP proxy for Microsoft 365 Copilot. Exposes
      `/v1/chat/completions` and `/v1/models` so coding agents (Cursor, pi,
      OpenClaw, etc.) can use your work Copilot subscription, including GPT-5.5.


      Upstream: https://github.com/cramt/m365-copilot-proxy


      Image: ghcr.io/drakolordx7/m365-copilot-proxy-docker:latest


      Auth: open `http://<host>:4141/auth` and sign in with Microsoft
      (passkeys / Entra Authenticator supported). No TOTP seed required.


      Clients: `http://<host>:4141/v1` with any API key (e.g. `m365`).
      Recommended model: `think-deeper` or `gpt-5.6-think-deeper`.


      Security: the proxy does not authenticate callers and uses your paid M365
      account. Prefer LAN-only access or put it behind an authenticated reverse proxy.
  developer: drakolordx7
  hostname: ""
  icon: https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/microsoftcopilot.svg
  index: /auth
  is_uncontrolled: false
  main: m365-copilot-proxy
  port_map: "4141"
  scheme: http
  screenshot_link: []
  store_app_id: m365-copilot-proxy
  tagline:
    en_US: Use Microsoft 365 Copilot (GPT-5.5) via an OpenAI-compatible API.
  thumbnail: ""
  tips:
    before_install:
      en_US: |
        Install, then open `http://<casaos-ip>:4141/auth` and sign in with Microsoft (passkeys OK).

        Client: `http://<casaos-ip>:4141/v1` · API key: any · model: `think-deeper`
  title:
    custom: ""
    en_US: M365 Copilot Proxy
